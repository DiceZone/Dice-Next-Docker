name: Build Dice!Next Docker Image

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional Dice!Next Release tag; leave empty to use the latest release.'
        required: false
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: dice-next-docker
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY: DiceZone/Dice-Next
  IMAGE_NAME: ghcr.io/dicezone/dice-next
  DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_REPOSITORY || 'shiaworkshop/dice-next' }}

jobs:
  resolve-release:
    name: Check Dice!Next Release
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.release.outputs.should_build }}
      tag: ${{ steps.release.outputs.tag }}
      amd64_url: ${{ steps.release.outputs.amd64_url }}
      arm64_url: ${{ steps.release.outputs.arm64_url }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        env:
          MANUAL_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_TOKEN: ${{ secrets.DICE_NEXT_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          headers=(-H 'Accept: application/vnd.github+json')
          if [[ -n "$SOURCE_TOKEN" ]]; then
            headers+=(-H "Authorization: Bearer $SOURCE_TOKEN")
          fi
          if [[ -n "$MANUAL_TAG" ]]; then
            endpoint="https://api.github.com/repos/${SOURCE_REPOSITORY}/releases/tags/${MANUAL_TAG}"
          else
            endpoint="https://api.github.com/repos/${SOURCE_REPOSITORY}/releases/latest"
          fi
          release=$(curl --fail --silent --show-error --location "${headers[@]}" "$endpoint")
          tag=$(jq -r '.tag_name' <<< "$release")
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]] || {
            echo "Unexpected Dice!Next release tag: $tag" >&2
            exit 1
          }
          previous=$(tr -d '[:space:]' < last_release_tag.txt 2>/dev/null || true)
          should_build=false
          if [[ "$EVENT_NAME" == workflow_dispatch || "$tag" != "$previous" ]]; then
            should_build=true
          fi
          amd64_url=$(jq -r '.assets[] | select(.name | test("-linux-amd64-.*\\.tar\\.gz$")) | .browser_download_url' <<< "$release" | head -n1)
          arm64_url=$(jq -r '.assets[] | select(.name | test("-linux-arm64-.*\\.tar\\.gz$")) | .browser_download_url' <<< "$release" | head -n1)
          [[ -n "$amd64_url" && "$amd64_url" != null ]] || { echo 'Linux amd64 package is missing' >&2; exit 1; }
          [[ -n "$arm64_url" && "$arm64_url" != null ]] || { echo 'Linux arm64 package is missing' >&2; exit 1; }
          printf 'should_build=%s\n' "$should_build" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'amd64_url=%s\n' "$amd64_url" >> "$GITHUB_OUTPUT"
          printf 'arm64_url=%s\n' "$arm64_url" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build and Push Multi-arch Image
    needs: resolve-release
    if: needs.resolve-release.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$DOCKERHUB_USERNAME" ]] || { echo 'DOCKERHUB_USERNAME is not configured' >&2; exit 1; }
          [[ -n "$DOCKERHUB_TOKEN" ]] || { echo 'DOCKERHUB_TOKEN is not configured' >&2; exit 1; }
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build amd64 candidate for runtime smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          build-args: |
            RELEASE_URL_AMD64=${{ needs.resolve-release.outputs.amd64_url }}
            RELEASE_URL_ARM64=${{ needs.resolve-release.outputs.arm64_url }}
          tags: dice-next-smoke:${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=dice-next-image
          cache-to: type=gha,mode=max,scope=dice-next-image
      - name: Verify container runtime and self-update boundary
        env:
          SMOKE_IMAGE: dice-next-smoke:${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail

          container="dice-next-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          work_dir=$(mktemp -d)
          cookie_jar="$work_dir/cookies.txt"

          cleanup() {
            docker rm --force "$container" >/dev/null 2>&1 || true
            rm -rf "$work_dir"
          }
          show_logs() {
            echo '--- Dice!Next container logs ---' >&2
            docker logs "$container" >&2 || true
          }
          trap cleanup EXIT
          trap show_logs ERR

          docker run --detach --name "$container" \
            --publish 127.0.0.1::18088 \
            "$SMOKE_IMAGE" >/dev/null

          endpoint=$(docker port "$container" 18088/tcp | head -n1)
          port=${endpoint##*:}
          base_url="http://127.0.0.1:$port"
          ready=false
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error \
              "$base_url/api/auth/status" > "$work_dir/auth-status.json"; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            echo 'Dice!Next did not become ready within 60 seconds' >&2
            show_logs
            exit 1
          fi
          jq -e '.code == 0 and .data.need_setup == true' \
            "$work_dir/auth-status.json" >/dev/null

          password='DnSmoke-2026!'
          jq -nc --arg password "$password" \
            '{password: $password, trust_device: false}' > "$work_dir/setup-request.json"
          curl --fail --silent --show-error \
            --cookie-jar "$cookie_jar" \
            --header 'Content-Type: application/json' \
            --data-binary "@$work_dir/setup-request.json" \
            "$base_url/api/auth/setup" > "$work_dir/setup-response.json"
          jq -e '.code == 0 and .data.authed == true' \
            "$work_dir/setup-response.json" >/dev/null

          curl --fail --silent --show-error \
            --cookie "$cookie_jar" \
            "$base_url/api/system/update" > "$work_dir/update-status.json"
          jq -e '
            .code == 0 and
            .data.runtime.container == true and
            .data.downloadSupported == false and
            .data.installSupported == false and
            .data.selfUpdateBlockedReason == "container"
          ' "$work_dir/update-status.json" >/dev/null

          for endpoint in download install; do
            curl --fail --silent --show-error \
              --cookie "$cookie_jar" \
              --request POST \
              "$base_url/api/system/update/$endpoint" \
              > "$work_dir/$endpoint-response.json"
            jq -e '
              .code != 0 and
              (.message | contains("disabled inside containers"))
            ' "$work_dir/$endpoint-response.json" >/dev/null
          done

          curl --fail --silent --show-error \
            --cookie "$cookie_jar" \
            --header 'Content-Type: application/json' \
            --request PUT \
            --data '{"autoAction":"download"}' \
            "$base_url/api/system/update" > "$work_dir/auto-action-response.json"
          jq -e '
            .code != 0 and
            (.message | contains("disabled inside containers"))
          ' "$work_dir/auto-action-response.json" >/dev/null

          docker inspect --format '{{.State.Running}}' "$container" | grep -Fx true
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            RELEASE_URL_AMD64=${{ needs.resolve-release.outputs.amd64_url }}
            RELEASE_URL_ARM64=${{ needs.resolve-release.outputs.arm64_url }}
          cache-from: type=gha,scope=dice-next-image
          labels: |
            org.opencontainers.image.source=https://github.com/DiceZone/Dice-Next-Docker
            org.opencontainers.image.url=https://github.com/DiceZone/Dice-Next
            org.opencontainers.image.version=${{ needs.resolve-release.outputs.tag }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.resolve-release.outputs.tag }}
            ${{ env.IMAGE_NAME }}:beta
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.DOCKERHUB_IMAGE }}:${{ needs.resolve-release.outputs.tag }}
            ${{ env.DOCKERHUB_IMAGE }}:beta
            ${{ env.DOCKERHUB_IMAGE }}:latest

  record-release:
    name: Record Published Release
    needs: [resolve-release, build-and-push]
    if: needs.resolve-release.outputs.should_build == 'true' && needs.build-and-push.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Record successful image source
        env:
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$RELEASE_TAG" > last_release_tag.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add last_release_tag.txt
          git commit -m "chore: record Dice!Next release ${RELEASE_TAG}"
          git push
