services:
  dice-next:
    image: shiaworkshop/dice-next:latest
    container_name: dice-next
    environment:
      MODE: napcat
    ports:
      - "18088:18088"
    # M2: 最小权限加固（保持运行，但去掉特权能力/写根文件系统）
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - "${PWD}/config:/app/config"
      - "${PWD}/data:/app/data"
      - "${PWD}/napcat/config:/app/napcat/config"
    networks:
      - dice-next

  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    hostname: dice-next-napcat
    environment:
      MODE: dice
    ports:
      - "6099:6099"
    volumes:
      - "${PWD}/napcat/config:/app/napcat/config"
      - "${PWD}/napcat/QQ_DATA:/app/.config/QQ"
      - "${PWD}/qrcode:/app/napcat/cache"
      - "${PWD}/config:/app/config"
      - "${PWD}/data:/app/data"
    networks:
      - dice-next

networks:
  dice-next:
    driver: bridge
